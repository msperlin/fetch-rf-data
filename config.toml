[dirs]
# Diretório principal onde ficam os arquivos baixados, extraídos e o banco.
processing_dir = "~/Desktop/rfb_processing"
# Nomes das subpastas de trabalho criadas dentro de processing_dir.
zip_dir = "01_zip-files"
unzip_dir = "02_unzipped_files"
sqlite_dir = "03_sqlite_file"

[urls]
# Public Nextcloud share with the Receita Federal open CNPJ data.
# The WebDAV endpoint is used to list the monthly folders and download files.
base_url = "https://arquivos.receitafederal.gov.br/public.php/webdav/Dados/Cadastros/CNPJ/"
# Token do compartilhamento público. Pode ser sobrescrito por RFB_SHARE_TOKEN.
share_token = "gn672Ad4CF8N6TK"
# "latest" (pasta mais recente) ou uma pasta específica, e.g. "2026-08".
month = "latest"

[downloads]
# Número de downloads simultâneos.
max_concurrent_downloads = 3
# Timeout geral (usado para conectar/ler quando os específicos não são dados).
request_timeout = 15
# Timeouts separados (opcionais): conexão e leitura por chunk.
connect_timeout = 10
read_timeout = 60
# Tentativas por arquivo e base do backoff exponencial (com jitter).
max_attempts = 3
backoff = 2
# Arquivos acima deste tamanho (MB) formam a segunda fase, com pool próprio.
large_file_threshold_mb = 100
# Downloads simultâneos para os arquivos grandes.
max_large_downloads = 2
# Retomar downloads parciais (.part) via HTTP Range.
resume = true
# Verificar se o arquivo baixado é um zip válido.
verify_zip = true
# User-Agent enviado nas requisições WebDAV.
user_agent = "fetch-cnpj/1.0"

[arquivos]
files_to_download = [
    "Cnaes.zip", "Estabelecimentos", "Empresas", 
    #"Socios",
    "Naturezas.zip",  "Municipios.zip", "Paises.zip", "Qualificacoes.zip", 
    "Motivos.zip"
    ]

[unzip]
# Pular arquivos .zip cujos membros já foram extraídos (idempotente/retomável).
skip_existing = true
# Apagar o arquivo .zip depois de extrair com sucesso.
remove_zip_after_extract = false

[leitura]
chunksize = 500_000
# Remover os arquivos extraídos depois de carregá-los no banco.
remove_extracted_after_use = false
# Codificação e separador dos CSVs publicados pela Receita Federal.
encoding = "latin1"
separator = ";"

[sqlite]
# Backend de carga: "duckdb" (rápido, padrão) ou "sqlite" (legado pandas+SQLAlchemy).
backend = "duckdb"
# Ajustes do DuckDB (usados quando backend = "duckdb").
# 0 = usar todos os núcleos; temp_dir vazio = <processing_dir>/duckdb_tmp.
duckdb_threads = 0
duckdb_memory_limit = "0"
duckdb_temp_dir = ""
# Preencher colunas faltantes com NULL em vez de falhar (CSV fora do padrão).
duckdb_null_padding = false
# Mostrar barras de progresso e mensagens durante a carga.
show_progress = true
# Nome do arquivo do banco. "{date}" é substituído pela data de execução.
db_filename = "{date}_RF-CNPJ-database.db"
# Formato da data usado em "{date}" (ver strftime).
db_date_format = "%Y%m%d"
# PRAGMAs aplicados durante a carga em massa.
load_pragmas = [
    "PRAGMA journal_mode = OFF",
    "PRAGMA synchronous = OFF",
    "PRAGMA temp_store = MEMORY",
    "PRAGMA cache_size = -200000",
]
# PRAGMAs restaurados ao final, devolvendo o banco a um modo durável.
final_pragmas = [
    "PRAGMA journal_mode = DELETE",
    "PRAGMA synchronous = NORMAL",
]

[colunas]
estabelecimento_cols = [
