name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    name: smoke test distributions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Import the wheel
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          python -c "import rfbpy; print('wheel', rfbpy.__version__)"

      - name: Import the sdist
        run: >-
          uv run --isolated --no-project --with dist/*.tar.gz
          python -c "import rfbpy; print('sdist', rfbpy.__version__)"

      - name: Console script
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          rfbpy --help

  publish:
    name: publish to PyPI
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rfbpy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/rfbpy/__init__.py)
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish
