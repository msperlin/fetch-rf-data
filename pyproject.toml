    "duckdb>=1.5.6",
    "lxml>=6.0.2",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.45",
    "toml>=0.10.2",
    "tqdm>=4.67.1",
]
